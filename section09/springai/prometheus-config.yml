# Prometheus configuration file to scrape metrics from a Spring Boot application
# running inside a Docker container.
# Introduced in Sec9_Chap95
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'spring-ai'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']