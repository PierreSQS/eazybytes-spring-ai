services:
  # QDRANT VECTOR DATABASE SERVICE
  qdrant:
    image: 'qdrant/qdrant:latest'
    container_name: qdrant
    ports:
      - '6333:6333'
      - '6334:6334'

  # PROMETHEUS SERVICE FOR MONITORING
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - "./prometheus-config.yml:/etc/prometheus/prometheus.yml"
    networks:
      - spring-ai
    ports:
      - "9090:9090"

  # GRAFANA SERVICE FOR DASHBOARD VISUALIZATION
  # WHICH FETCHES DATA FROM PROMETHEUS
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - '3000:3000'
    volumes:
      - eazybytes-grafana-storage:/var/lib/grafana
    networks:
      - spring-ai

networks:
  spring-ai:
    driver: bridge

# Persistent storage for Grafana
volumes:
  eazybytes-grafana-storage:
    driver: local