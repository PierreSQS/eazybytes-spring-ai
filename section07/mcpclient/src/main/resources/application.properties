spring.application.name=mcpclient

# Enable ANSI colors in the console output
spring.output.ansi.enabled=ALWAYS
#logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# Set logging level for the AI chat client advisor to DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.openai.api-key=${OPENAI_API_KEY}

# Path to the MCP servers configuration file used by the MCP client stdio implementation.
# Must reference a classpath resource (for example `src/main/resources/mcp-servers.json`).
# Expected format: JSON structure containing the server entries consumed by the client.
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
